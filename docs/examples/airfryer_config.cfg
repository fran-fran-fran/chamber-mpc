# Example: Airfryer annealing oven (standalone, multi-point h(T))
#
# Multi-point calibration for wide temperature range (80-160 deg C).
# Heating element limiting via secondary sensor.
# No bed heater.
#
# Note: For slow chambers/ovens, consider raising check_gain_time in
# [verify_heater chamber] (e.g. check_gain_time: 600) so Klipper does not
# trigger false thermal-runaway shutdowns during slow heat-up.

[chamber_mpc]
heater: chamber
heater_power: 1800
secondary_sensor: heating_element
s2_safe_temp: 220
s2_safe_temp_zone: 10

# Calibrated parameters (populated by MPC_CHAMBER_CALIBRATE):
# chamber_heat_capacity: 500.0
# s1_responsiveness: 0.0248
# target_reach_time: 2.0
